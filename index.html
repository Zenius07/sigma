<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <!-- import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <!-- import styles -->
    <style>
        @keyframes screenturn {
            from {
                transform: scale(1) rotate(0deg);
            }
            to {
                transform: scale(1.2) rotate(5deg);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        code {
            font-family: 'Roboto Mono', monospace;
            padding: 2px 4px;
            background-color: rgba(0,0,0, 0.25);
            border-radius: 4px;
        }

        #content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        #screenbg {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            animation-name: screenturn;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 1em;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #curmap {
            padding: 4px 8px;
            background-color: rgba(0,0,0, 0.5);
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
            color: #00ff00;
        }

        .rules {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 1em;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .rules b {
            font-size: 1em;
            color: #ffaa00;
            display: block;
            margin-bottom: 8px;
        }

        #random_rule {
            font-size: 0.9em;
            line-height: 1.3;
            color: #ffffff;
        }

        .bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1.5em 2em;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 1.4em;
            font-weight: bold;
            color: #00aaff;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .snowflake {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            filter: blur(1px);
            animation: fall linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            from {
                top: -10px;
                opacity: 1;
            }
            to {
                top: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="content">
        <img id="screenbg" src="" alt="background">
        <div class="stats">
            <span id="curmap">Поточна мапа: 🤔</span>
        </div>
        <div class="rules">
            <b>Рандомне правило</b><br>
            <span id="random_rule">якесь рандомне правило</span>
        </div>
        <div class="bottom">
            <div class="title">Ви заходите на сервер 🍺Підпивас Сандбокс🍺</div>
        </div>
    </div>
    <audio id="bgmusic" autoplay loop volume="0.5">
        <source src="music.mp3" type="audio/mpeg">
        Ваш браузер не підтримує аудіо елемент.
    </audio>
    <script>

        var screenshots = [
          


        "https://zenius07.github.io/sigma/papka/1.jpg",
        "https://zenius07.github.io/sigma/papka/2.jpg",
        "https://zenius07.github.io/sigma/papka/3.jpg",
        "https://zenius07.github.io/sigma/papka/4.jpg",
        "https://zenius07.github.io/sigma/papka/5.jpg",
        "https://zenius07.github.io/sigma/papka/6.jpg",
        "https://zenius07.github.io/sigma/papka/7.jpg",
        "https://zenius07.github.io/sigma/papka/8.jpg",
        "https://zenius07.github.io/sigma/papka/9.png",
        "https://zenius07.github.io/sigma/papka/10.png",
        "https://zenius07.github.io/sigma/papka/11.jpg",
        "https://zenius07.github.io/sigma/papka/12.png",
        "https://zenius07.github.io/sigma/papka/13.png",
        "https://zenius07.github.io/sigma/papka/14.png",
        "https://zenius07.github.io/sigma/papka/15.png",
        "https://zenius07.github.io/sigma/papka/16.png",
        "https://zenius07.github.io/sigma/papka/17.png",
        "https://zenius07.github.io/sigma/papka/18.png",
    

        ];

        var rules = [
            "1. Останнє слово за адміністрацією, у спірних ситуаціях адміністрація має вирішальне слово.",
            "2. Не будь мудаком - універсальне правило яке охоплює всі можливі порушення.",
            "3. Проп-пуш, проп-блок заборонено, використовуйте кейпади або пропи які можливо зруйнувати вибухівкою.",
            "4. Чіти, E2 ВХ, Е2 Радари, Pac3 абуз і подібна перевага над іншими гравцями заборонена.",
            "5. Не заважайте білдерам будувати або ж будучи білдером не заважайте гравцям в пвп.",
            "6. Заборонена нечесна перевага над іншими, наприклад турелі які вбивають моментально, вайр мод побудови проти яких неможливо виграти і т.п.",
            "7. Якщо ви будуєте базу, до неї повинен бути прийнамні 1 спосіб адекватно потрапити, наприклад пропи які можно зламати вибухівкою або кейпади які відкривають двері на тривалий час (не на 1 секунду)."
        ];

        setInterval(setBackground, 3000);
        function setBackground() {
            var selected_screenshot = screenshots[Math.floor(Math.random() * screenshots.length)];
            document.getElementById("screenbg").src = selected_screenshot;
        }

        setInterval(writeRandomRule, 15000);
        function writeRandomRule() {
            var selected_rule = rules[Math.floor(Math.random() * rules.length)];
            document.getElementById("random_rule").innerHTML = selected_rule;
        }
        
        function GameDetails( servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language ) {
            document.getElementById("curmap").innerHTML = "Поточна мапа: " + mapname;
        }
        
        // Створення сніжинок
        for (let i = 0; i < 50; i++) {
            let snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.style.left = Math.random() * 100 + '%';
            snow.style.animationDuration = (Math.random() * 5 + 5) + 's';
            snow.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(snow);
        }
        
        // Встановлення гучності музики
        document.getElementById('bgmusic').volume = 0.5;
        
        setBackground();
        writeRandomRule();
        
    </script>
</body>
</html>
