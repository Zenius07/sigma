<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <!-- import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <!-- import styles -->
    <style>
        @keyframes screenturn {
            from {
                transform: scale(1) rotate(0deg);
            }
            to {
                transform: scale(1.2) rotate(5deg);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        code {
            font-family: 'Roboto Mono', monospace;
            padding: 2px 4px;
            background-color: rgba(0,0,0, 0.25);
            border-radius: 4px;
        }

        #content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        #screenbg {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            animation-name: screenturn;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 1em;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #curmap {
            padding: 4px 8px;
            background-color: rgba(0,0,0, 0.5);
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
            color: #00ff00;
        }

        .rules {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 1em;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .rules b {
            font-size: 1em;
            color: #ffaa00;
            display: block;
            margin-bottom: 8px;
        }

        #random_rule {
            font-size: 0.9em;
            line-height: 1.3;
            color: #ffffff;
        }

        .bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1.5em 2em;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 1.4em;
            font-weight: bold;
            color: #00aaff;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="content">
        <img id="screenbg" src="" alt="background">
        <div class="stats">
            <span id="curmap">Поточна мапа: 🤔</span>
        </div>
        <div class="rules">
            <b>Рандомне правило</b><br>
            <span id="random_rule">якесь рандомне правило</span>
        </div>
        <div class="bottom">
            <div class="title">Ви заходите на сервер ГамноДав Сандбокс</div>
        </div>
    </div>
    <script>

        var screenshots = [
          


        "https://zenius07.github.io/sigma/papka/1.png",
        "https://zenius07.github.io/sigma/papka/2.png",
        "https://zenius07.github.io/sigma/papka/4.png",
        "https://zenius07.github.io/sigma/papka/5.png",
        "https://zenius07.github.io/sigma/papka/6.png",
        "https://zenius07.github.io/sigma/papka/7.png",
        "https://zenius07.github.io/sigma/papka/8.png",
        "https://zenius07.github.io/sigma/papka/9.png",
        "https://zenius07.github.io/sigma/papka/10.png",
        "https://zenius07.github.io/sigma/papka/11.png",
        "https://zenius07.github.io/sigma/papka/12.png",
        "https://zenius07.github.io/sigma/papka/13.png",
        "https://zenius07.github.io/sigma/papka/14.png",
        "https://zenius07.github.io/sigma/papka/15.png",
        "https://zenius07.github.io/sigma/papka/16.png",
        "https://zenius07.github.io/sigma/papka/17.png",
        "https://zenius07.github.io/sigma/papka/20.png",
        "https://zenius07.github.io/sigma/papka/22.png"


        ];

        var rules = [
            "1. Поводь себе адекватно, не роби хрінь яка шкодить серверу і тп.",
            "2. Не проп-блоч, не проп-пуш та не проп-кіль.",
            "3. Не заважай гравцям які знаходяться у режимі будівельника.",
            "4. Знаходячись у режимі будівельника не надавай перевагу гравцям у пвп, не залітай в ноукліпі на чужі бази і не розвідуй їх.",
            "5. Як ви могли помітити на сервері нема JMod, а це значить що нема крафту бомб і тп. Виходить частина бомб не буде заблокована для спавну, але це не значить що ними дозволено швирятися за допомогою фізгану. Щоб використати бомбу вам треба її підвісити на літак з LVS, або свій літак з пропів який повинен ламатися і не бути імбалансним.",
            "6. Заборонена Wire/E2 перевага, заборонені саморобні супершвидкі літаки та інша імбалансна чухня. (Перед використанням якоїсь побудови рекомендуємо узгодити її з адміном).",
            "7. E2 WH як і звичайні чіти заборонені."
        ];

        setInterval(setBackground, 3000);
        function setBackground() {
            var selected_screenshot = screenshots[Math.floor(Math.random() * screenshots.length)];
            document.getElementById("screenbg").src = selected_screenshot;
        }

        setInterval(writeRandomRule, 15000);
        function writeRandomRule() {
            var selected_rule = rules[Math.floor(Math.random() * rules.length)];
            document.getElementById("random_rule").innerHTML = selected_rule;
        }
        
        function GameDetails( servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language ) {
            document.getElementById("curmap").innerHTML = "Поточна мапа: " + mapname;
        }
        
        setBackground();
        writeRandomRule();
        
    </script>
</body>
</html>
